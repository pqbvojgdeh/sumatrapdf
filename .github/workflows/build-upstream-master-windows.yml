name: Build upstream master Windows x64 AVX2 optimized Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit from the mirrored official master branch.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-upstream-master-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish AVX2 optimized Windows x64 Release
    runs-on: windows-2025-vs2026
    timeout-minutes: 180

    steps:
      - name: Validate requested source revision
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SOURCE_SHA -notmatch "^[0-9a-f]{40}$") {
            throw "source_sha must be a full 40-character Git commit SHA."
          }

          $mirrored = (
            git ls-remote "https://github.com/${{ github.repository }}.git" "refs/heads/upstream-master"
          ).Split()[0]

          if ($mirrored -ne $env:SOURCE_SHA) {
            throw "source_sha is not the current upstream-master revision."
          }

      - name: Check out pinned source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate embedded documentation
        shell: pwsh
        run: bun .\cmd\gen-docs.ts

      - name: Build maximally optimized AVX2 Release x64 binaries
        shell: pwsh
        env:
          # Release already supplies /O1, /GL, /Gy, /GF and full LTCG.
          # /Gw lets /OPT:REF remove unused global data; extra ICF passes fold
          # more identical COMDATs without requiring a newer CPU at runtime.
          CL: /Gw /Zc:inline /arch:AVX2
          LINK: /OPT:REF /OPT:ICF=10 /LTCG
        run: bun .\cmd\build-all.ts

      - name: Package and verify AVX2 optimized standalone Release executable
        id: package
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $source = "out\rel64\SumatraPDF-static.exe"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Release executable was not produced: $source"
          }

          $shortSha = $env:SOURCE_SHA.Substring(0, 7)
          $assetName = "SumatraPDF-$shortSha-windows-x64-avx2-release-optimized.exe"
          $asset = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath $source -Destination $asset

          $version = (Get-Item -LiteralPath $asset).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The Release executable has no file version."
          }

          $sevenZipCommand = Get-Command "7z.exe" -ErrorAction SilentlyContinue
          $sevenZip = if ($sevenZipCommand) {
            $sevenZipCommand.Source
          } else {
            Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          }

          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "7-Zip executable was not found: $sevenZip"
          }

          $archiveName = "SumatraPDF-$shortSha-windows-x64-avx2-release-optimized.7z"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName

          Push-Location $env:RUNNER_TEMP
          try {
            & $sevenZip a "-t7z" "-mx=9" "-m0=lzma2" "-md=512m" "-mfb=273" "-ms=on" "-mmt=on" $archiveName $assetName
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip maximum compression failed: exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          & $sevenZip t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "7-Zip archive verification failed: exit code $LASTEXITCODE"
          }

          if ((Get-Item -LiteralPath $archive).Length -ge (Get-Item -LiteralPath $asset).Length) {
            throw "The maximum-compression archive is not smaller than the executable."
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $checksumName = "SumatraPDF-$shortSha-windows-x64-avx2-release-optimized-SHA256SUMS.txt"
          $checksum = Join-Path $env:RUNNER_TEMP $checksumName
          @(
            "$hash  $assetName"
            "$archiveHash  $archiveName"
          ) | Set-Content -Encoding ascii $checksum

          "asset=$asset" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          {
            "## AVX2 optimized Windows x64 Release package"
            ""
            "- source: $env:SOURCE_SHA"
            "- file version: $version"
            "- SHA-256: $hash"
            "- configuration: Release|x64"
            "- compiler: /O1 /GL /Gy /GF /Gw /Zc:inline /arch:AVX2"
            "- linker: /LTCG /OPT:REF /OPT:ICF=10"
            "- archive: 7z LZMA2 maximum compression"
          } >> $env:GITHUB_STEP_SUMMARY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: sumatrapdf-${{ steps.package.outputs.short_sha }}-windows-x64-avx2-release-optimized
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ASSET: ${{ steps.package.outputs.asset }}
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          FILE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "sumatrapdf-master-$env:SHORT_SHA-avx2-optimized"
          $title = "SumatraPDF master $env:SHORT_SHA (AVX2 optimized Windows x64 Release)"
          $notes = @"
          Automated Windows x64 Release build from the official SumatraPDF master branch.

          Source commit: $env:SOURCE_SHA
          File version: $env:FILE_VERSION
          Build configuration: Release|x64 (not Debug)
          Compiler optimization: /O1 /GL /Gy /GF /Gw /Zc:inline /arch:AVX2
          Link optimization: /LTCG /OPT:REF /OPT:ICF=10

          This build requires a processor with AVX2 support. The executable is the standalone static build. The 7z asset uses maximum LZMA2 compression for the smallest download. Verify either file with SHA256SUMS.
          "@

          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
            gh release upload $tag $env:ASSET $env:ARCHIVE $env:CHECKSUM --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $env:ASSET $env:ARCHIVE $env:CHECKSUM --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title $title --notes $notes --prerelease
          }
